<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e293b">
  <title>★Pjt 執筆作戦指令室</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --tag-bg: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 60px; overscroll-behavior-y: contain; }

    /* スプラッシュ画面 */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.6s ease;
    }
    #splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #splash-logo {
      max-width: 80%;
      max-height: 40%;
      width: auto;
      height: auto;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    header { background-color: var(--card-bg); padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.1rem; color: var(--accent); }
    .nav-tabs { display: flex; background: var(--card-bg); border-bottom: 1px solid var(--border); overflow-x: auto; }
    .nav-tab { flex: 1; padding: 12px; text-align: center; font-size: 0.9rem; color: var(--text-muted); cursor: pointer; border: none; background: none; white-space: nowrap; }
    .nav-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); font-weight: bold; }
    .container { max-width: 900px; margin: 0 auto; padding: 16px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .card h2 { font-size: 1rem; margin-bottom: 12px; color: var(--accent); }
    input, textarea, select { width: 100%; background: #0b0f19; border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 0.95rem; }
    
    textarea { resize: none; min-height: 80px; }
    .fullscreen-trigger { cursor: pointer; }
    .fullscreen-trigger:focus { border-color: var(--accent); outline: none; }
    
    button.btn { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; width: 100%; }
    button.btn:hover { background: var(--accent-hover); }
    button.btn-secondary { background: #475569; color: #fff; font-weight: bold; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
    button.btn-secondary:hover { background: #64748b; }
    .item-list { display: flex; flex-direction: column; gap: 12px; }
    
    .item-card { 
      background: #131d2e; 
      border: 1px solid var(--border); 
      border-radius: 6px; 
      padding: 12px; 
      position: relative; 
      cursor: pointer; 
      transition: border-color 0.2s, background-color 0.2s;
    }
    .item-card:hover {
      border-color: var(--accent);
      background-color: #162438;
    }
    .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding-right: 120px; }
    
    /* カテゴリタグ基本スタイル */
    .item-tag { 
      font-size: 0.75rem; 
      padding: 3px 9px; 
      border-radius: 4px; 
      font-weight: bold; 
      display: inline-block;
      letter-spacing: 0.02em;
    }

    /* カテゴリ別の網掛けカラー */
    .item-tag.tag-main {
      background-color: rgba(14, 165, 233, 0.2);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .item-tag.tag-gas {
      background-color: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.4);
    }
    .item-tag.tag-pc {
      background-color: rgba(168, 85, 247, 0.2);
      color: #c084fc;
      border: 1px solid rgba(192, 132, 252, 0.4);
    }
    .item-tag.tag-other {
      background-color: rgba(148, 163, 184, 0.15);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .item-date { font-size: 0.75rem; color: var(--text-muted); }
    .item-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 4px; }

    /* 本文は最大3行で省略（末尾を「…」にする） */
    .item-body { 
      font-size: 0.85rem; 
      color: var(--text-muted); 
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-all;
    }
    
    .card-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 2; }
    .action-btn { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
    .action-btn:hover { color: var(--text); border-color: var(--accent); }
    .action-btn.copy:hover { color: #86efac; border-color: #10b981; background: rgba(16,185,129,0.1); }
    .action-btn.delete:hover { color: #fca5a5; border-color: var(--danger); background: rgba(239,68,68,0.1); }

    /* 全画面入力モーダル */
    #fs-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #090d16;
      z-index: 10000;
      flex-direction: column;
      padding: 12px;
    }
    #fs-modal.active {
      display: flex;
    }
    .fs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .fs-header-title {
      font-size: 1rem;
      font-weight: bold;
      color: var(--accent);
    }
    .fs-done-btn {
      background: #10b981;
      color: #fff;
      border: none;
      font-weight: bold;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #fs-textarea {
      flex: 1;
      width: 100%;
      background: #020617;
      border: 1px solid var(--border);
      color: #fff;
      font-size: 1.05rem;
      line-height: 1.6;
      padding: 14px;
      border-radius: 8px;
      outline: none;
      resize: none;
      margin-bottom: 0;
    }

    /* 設定アコーディオン */
    details.concept-accordion {
      background: #0b1324;
      border-left: 4px solid var(--accent);
      padding: 10px 14px;
      margin-bottom: 12px;
      border-radius: 0 6px 6px 0;
      transition: background-color 0.2s;
    }
    details.concept-accordion summary {
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      outline: none;
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    details.concept-accordion summary::-webkit-details-marker {
      display: none;
    }
    details.concept-accordion summary::after {
      content: '▼';
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: transform 0.2s;
    }
    details.concept-accordion[open] summary::after {
      transform: rotate(180deg);
    }
    .accordion-body {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.6;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <!-- 全画面スプラッシュ画面 (logo.png) -->
  <div id="splash-screen">
    <img src="logo.png" alt="ハナトンソフト ロゴ" id="splash-logo">
  </div>

  <!-- 全画面入力モーダル画面 -->
  <div id="fs-modal">
    <div class="fs-header">
      <span class="fs-header-title" id="fs-modal-label">全画面エディタ</span>
      <button class="fs-done-btn" onclick="closeFullscreenEditor()">完了 ✓</button>
    </div>
    <textarea id="fs-textarea" placeholder="ここに集中して執筆してください..."></textarea>
  </div>

  <header>
    <h1>★Pjt 執筆作戦指令室</h1>
    <span style="font-size: 0.8rem; color: var(--text-muted);">Cloudflare D1 & Zero Trust</span>
  </header>

  <div class="nav-tabs">
    <button class="nav-tab active" data-tab="tab-ideas" onclick="switchTab('tab-ideas', this)">💡 ネタ帳</button>
    <button class="nav-tab" data-tab="tab-editor" onclick="switchTab('tab-editor', this)">📝 執筆・プロット</button>
    <button class="nav-tab" data-tab="tab-settings" onclick="switchTab('tab-settings', this)">⚙️ 設定</button>
  </div>

  <div class="container">
    <!-- タブ1: ネタ帳 -->
    <div id="tab-ideas" class="tab-content active">
      <div class="card">
        <h2 id="idea-form-title">⚡ クイックネタ投下（D1即時保存）</h2>
        <input type="text" id="idea-title" placeholder="ネタの見出し（例：レジ締め1円合わない事件）">
        <textarea id="idea-body" class="fullscreen-trigger" placeholder="タップすると全画面でゆったり入力できます" onclick="openFullscreenEditor('idea-body', '💡 ネタ帳の本文入力')"></textarea>
        
        <div style="display: flex; gap: 8px;">
          <div style="flex: 1;">
            <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:4px;">カテゴリ設定</label>
            <select id="idea-category">
              <option value="メインネタ">メインネタ</option>
              <option value="gasネタ">gasネタ</option>
              <option value="pc教室ネタ">pc教室ネタ</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div style="flex: 1;">
            <label style="font-size:0.75rem; color:var(--accent); display:block; margin-bottom:4px; font-weight:bold;">🔍 表示絞り込み</label>
            <select id="idea-filter" onchange="applyIdeaFilter()" style="border-color:var(--accent);">
              <option value="all">すべて表示</option>
              <option value="メインネタ">メインネタのみ</option>
              <option value="gasネタ">gasネタのみ</option>
              <option value="pc教室ネタ">pc教室ネタのみ</option>
              <option value="その他">その他のみ</option>
            </select>
          </div>
        </div>

        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="btn" id="idea-save-btn" style="flex: 2; min-width: 140px;" onclick="saveIdea()">D1データベースへ送信</button>
          <button class="btn" style="flex: 1; min-width: 110px; background: #059669; color: #fff;" onclick="exportCurrentIdea()">📋 コピー</button>
          <button class="btn-secondary" id="idea-cancel-btn" style="display: none;" onclick="resetIdeaForm()">新規作成に戻す</button>
        </div>
      </div>

      <div class="card">
        <h2>📋 クラウド同期ネタ一覧（クリックで編集）</h2>
        <div id="idea-list" class="item-list"></div>
      </div>
    </div>

    <!-- タブ2: 執筆・プロット -->
    <div id="tab-editor" class="tab-content">
      <details style="margin-bottom:16px; background:#131d2e; padding:10px; border-radius:6px; border:1px solid var(--border);">
        <summary style="cursor:pointer; font-weight:bold; color:#10b981;">🤖 AIプロット一括取り込み（ここをクリック）</summary>
        <textarea id="import-text" placeholder="ここにジェミーが作った専用テキストをまるごと貼り付けてください" style="min-height:100px; margin-top:10px;"></textarea>
        <button class="btn" style="background:#10b981; color:#fff;" onclick="importDraft()">各項目に一括振り分け</button>
      </details>

      <div class="card">
        <h2 id="draft-form-title">📝 下書きエディタ（二段ロケット型）</h2>
        <input type="text" id="draft-title" placeholder="記事タイトル（例：第1話：レジ締めの小銭計算で夜中まで消耗する現場を〜）">
        <label style="font-size:0.8rem; color:var(--accent);">【前半：現場ノベル・漫才パート】（タップで全画面）</label>
        <textarea id="draft-manzai" class="fullscreen-trigger" style="min-height: 100px;" placeholder="タップすると全画面でゆったり入力できます" onclick="openFullscreenEditor('draft-manzai', '🎭 前半：現場ノベル・漫才パートの編集')"></textarea>
        <label style="font-size:0.8rem; color:var(--accent);">【後半：現場DX・実践解説パート】（タップで全画面）</label>
        <textarea id="draft-tech" class="fullscreen-trigger" style="min-height: 100px;" placeholder="タップすると全画面でゆったり入力できます" onclick="openFullscreenEditor('draft-tech', '🛠️ 後半：現場DX・実践解説パートの編集')"></textarea>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="btn" id="draft-save-btn" style="flex: 2; min-width: 140px;" onclick="saveDraft()">下書きをD1に保存</button>
          <button class="btn" style="flex: 1; min-width: 110px; background: #059669; color: #fff;" onclick="exportDraft()">📋 全文コピー</button>
          <button class="btn-secondary" id="draft-cancel-btn" style="display: none;" onclick="resetEditor()">新規作成に戻す</button>
        </div>
      </div>
      <div class="card">
        <h2>📚 保存された下書き（クリックで編集）</h2>
        <div id="draft-list" class="item-list"></div>
      </div>
    </div>

    <!-- タブ3: 設定 -->
    <div id="tab-settings" class="tab-content">
      <!-- インポート＆エクスポート操作パネル -->
      <div class="card" style="border-color: #38bdf8;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <h2 style="margin-bottom:0;">⚙️️ 設計書の管理・更新</h2>
          <button class="btn" style="width:auto; padding:6px 12px; font-size:0.8rem; background:#059669; color:#fff;" onclick="exportSettings()">📋 全文コピー</button>
        </div>
        
        <details style="background:#131d2e; padding:10px; border-radius:6px; border:1px solid var(--border);">
          <summary style="cursor:pointer; font-weight:bold; color:var(--accent); font-size:0.9rem;">🤖 設計書の一括取り込み・更新（ここをクリック）</summary>
          <p style="font-size:0.75rem; color:var(--text-muted); margin-top:6px;">
            AIから出力された「### 見出し」区切りのテキストをそのまま貼り付けて保存すると、アコーディオンが即時更新されます。
          </p>
          <textarea id="settings-import-text" class="fullscreen-trigger" style="min-height:120px; margin-top:8px;" placeholder="ここに設計書テキストを貼り付けてください" onclick="openFullscreenEditor('settings-import-text', '⚙️ 設計書の一括編集・取り込み')"></textarea>
          <button class="btn" onclick="importSettings()">インポートして保存</button>
        </details>
      </div>

      <!-- 動的に描画される設計書アコーディオン -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h2 style="margin-bottom:0;" id="settings-rendered-title">📑 プロジェクト基本設計書</h2>
          <span style="font-size:0.75rem; color:var(--text-muted);">タイトルをタップして開閉</span>
        </div>
        <div id="settings-accordion-container"></div>
      </div>
    </div>
  </div>

  <script>
    const TABS = ['tab-ideas', 'tab-editor', 'tab-settings'];

    // --- デフォルトのプロジェクト基本設計書（完全統合・最終決定版） ---
    const DEFAULT_SETTINGS_TEXT = `# プロジェクト基本設計書（完全統合・最終決定版）

### 1. 作品基本情報・発信体制
* 作品タイトル：『就職氷河期世代の俺が、40過ぎて脱サラしたら、チートスキル「AI」で超パーソナル型DXを爆進している件』
* 媒体展開：note連載（週刊ベース） ＋ X（旧Twitter）連動 ➔ 書籍化・商業出版を見据えた企画
* ジャンル：実録・現場主義DX奮闘記（ビジネス×ライトノベル風味エッセイ）

【発信者・ペルソナ設計（2層構造）】
* 【著者（リアル・発信主体）】：カツカツ店長
  note・Xで読者や編集者と直接対峙する生身の書き手。現場で泥臭く働く当事者としての信頼感と、再現性のある一次情報ノウハウを届ける。
* 【主人公（作中キャラクター）】：喝活亭の店長（マスター）
  物語の中でジェミーや現場スタッフとドタバタ劇を繰り広げるフィクションの推進役。

【公式プロフィール文（X・note共通決定稿）】
カツカツ店長

IT企業で20年の社畜を経て10年前に脱サラ。今は小さな飲食店を経営。仕込みと雑務に追われながらも、AIを相棒に現場の業務改善ツールを爆速自作中！

📖 note連載中
『就職氷河期世代の俺が、40過ぎて脱サラしたら、チートスキル「AI」で超パーソナル型DXを爆進している件』

市販の高額SaaSに現場を合わせるな。厨房の悲鳴からツールを自作する「超パーソナル型DX」のリアルをお届けします。

### 2. 本書の思い・主題（読者に届けるコアメッセージ）
【魂のステートメント】
DX（デジタルトランスフォーメーション）とは、大企業が億単位の予算をかけて高額なSaaSをぶち込むことだけではない！
個人でも、自分に合った、自分だけにフォーカスされた、自分専用のDXが、お金と時間をかけずにできる時代になった。

【コアメッセージ・4つの柱】
* 「知識があるからこそ諦めていた」過去の絶望を覆す
  昔取った杵柄（LAMP環境、Linux、Apache、MySQL、自宅・店内Webサーバー）があるからこそ、環境構築だけで膨大な時間が溶ける現実を知っている。「ランチ営業と仕込みで手一杯な個人店主に、そんな時間は1ミリもない」と諦めていた。
  その「知識の壁」と「諦め」を、AI（Antigravity、Gemini、Cloudflare Pages、GitHub）が根底から覆した。サーバー構築もコマンドも不要。数分で動くものが目の前に現れる衝撃を届ける。
* 「属人化するな」という社畜時代の呪縛をぶち破れ
  大企業のシステム部門は「属人化の排除」「マニュアル化」「誰でも使える汎用性」を叫ぶ。だが、個人事業主や小規模チームにとって、そんなものは知ったことではない。
  「属人化？ 大いに結構！ 俺が使いやすければ、俺専用の歪なツールで100点満点だ」。
  メンテ不能で放置されたエクセルマクロの悪夢を恐れる必要はない。動かなくなったら、またGeminiに聞いて直させればいいだけ。修正コストがゼロの時代に、汎用性という名の妥協は不要。
* AIを「話し相手」から「最強の専属プログラマー」へ
  最初は壁打ち、調べ物、人生相談の相手でしかなかったAI。しかし、一歩踏み込んで実務の泥臭い課題を投げた瞬間、AIは「血の通った実用ツールを即座に錬成するチート軍師」へと化けた。
  「こんなことAIにできるわけがない」というタガが外れた瞬間、世界が変わる。現場の課題に寄り添えない市販のしょっぱいソフト屋は、本当に生き残れない時代が来た。
* 個人事業主・零細企業への魂のエール
  「市販のシステムは高すぎる」「帯に短し襷に長し」「無料アプリは連携できない」。そんな現場の悲鳴をそのままAIにぶつけてほしい。
  要件定義なんて小難しい言葉はいらない。言葉に詰まるなら、「手書きの日計表や、散らかった厨房の写真をそのまま貼り付けて『なんとかして』と叫べばいい」。
  Geminiは絶対に「できません」とは言わない。「だいたいできますよ」と、泥臭い現場に寄り添う手段を提示してくれる。まずやってみよう。自分専用のDXは、スマホ片手の一言から始まる。
* 【最終回の大伏線（エモい種明かし）】

    // --- タブ切り替え ---
    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(e => e.classList.remove('active'));
      
      const targetContent = document.getElementById(tabId);
      if (targetContent) targetContent.classList.add('active');

      const targetTabBtn = el || document.querySelector(`.nav-tab[data-tab="${tabId}"]`);
      if (targetTabBtn) targetTabBtn.classList.add('active');
    }

    // --- 全画面エディタ制御 ---
    let activeInputTargetId = null;

    function openFullscreenEditor(targetId, title) {
      activeInputTargetId = targetId;
      const targetEl = document.getElementById(targetId);
      const fsTextarea = document.getElementById('fs-textarea');
      const fsLabel = document.getElementById('fs-modal-label');

      fsLabel.innerText = title || '全画面エディタ';
      fsTextarea.value = targetEl.value;

      document.getElementById('fs-modal').classList.add('active');
      fsTextarea.focus();
    }

    function closeFullscreenEditor() {
      if (activeInputTargetId) {
        const targetEl = document.getElementById(activeInputTargetId);
        const fsTextarea = document.getElementById('fs-textarea');
        targetEl.value = fsTextarea.value;
      }
      document.getElementById('fs-modal').classList.remove('active');
      activeInputTargetId = null;
    }

    // --- スワイプによるタブ切り替え機能 ---
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', (e) => {
      if (document.getElementById('fs-modal').classList.contains('active')) return;
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (document.getElementById('fs-modal').classList.contains('active')) return;
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
    }, { passive: true });

    function handleSwipe(startX, startY, endX, endY) {
      const diffX = endX - startX;
      const diffY = endY - startY;
      
      if (Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
        const activeTabEl = document.querySelector('.tab-content.active');
        if (!activeTabEl) return;
        const currentTabId = activeTabEl.id;
        const currentIndex = TABS.indexOf(currentTabId);

        if (diffX < 0 && currentIndex < TABS.length - 1) {
          switchTab(TABS[currentIndex + 1]);
        } else if (diffX > 0 && currentIndex > 0) {
          switchTab(TABS[currentIndex - 1]);
        }
      }
    }

    // --- クリップボード共通コピー処理 ---
    async function copyToClipboard(text, successMsg) {
      try {
        await navigator.clipboard.writeText(text);
        alert(successMsg);
      } catch (err) {
        const tempArea = document.createElement('textarea');
        tempArea.value = text;
        document.body.appendChild(tempArea);
        tempArea.select();
        document.execCommand('copy');
        document.body.removeChild(tempArea);
        alert(successMsg);
      }
    }

    // --- 設定タブ：レンダリング＆インポート・エクスポート ---
    const ACCORDION_COLORS = ['#38bdf8', '#eab308', '#10b981', '#ec4899', '#6366f1', '#f97316', '#14b8a6', '#a855f7'];

    async function loadSettings() {
      let rawText = localStorage.getItem('project_settings_text');
      if (!rawText) {
        try {
          const res = await fetch('/api/settings');
          const data = await res.json();
          if (data && data.text) {
            rawText = data.text;
            localStorage.setItem('project_settings_text', rawText);
          }
        } catch (e) {
          console.warn('D1 settings fetch failed, fallback to default.');
        }
      }
      if (!rawText) rawText = DEFAULT_SETTINGS_TEXT;

      document.getElementById('settings-import-text').value = rawText;
      renderSettings(rawText);
    }

    function renderSettings(rawText) {
      const container = document.getElementById('settings-accordion-container');
      const lines = rawText.split('\n');
      
      let sections = [];
      let currentTitle = '';
      let currentContent = [];

      lines.forEach(line => {
        if (line.startsWith('# ')) {
          document.getElementById('settings-rendered-title').innerText = line.replace('# ', '').trim();
        } else if (line.startsWith('### ')) {
          if (currentTitle) {
            sections.push({ title: currentTitle, content: currentContent.join('\n').trim() });
          }
          currentTitle = line.replace('### ', '').trim();
          currentContent = [];
        } else {
          currentContent.push(line);
        }
      });
      if (currentTitle) {
        sections.push({ title: currentTitle, content: currentContent.join('\n').trim() });
      }

      container.innerHTML = sections.map((sec, idx) => {
        const color = ACCORDION_COLORS[idx % ACCORDION_COLORS.length];
        return `
          <details class="concept-accordion" style="border-left-color: ${color};">
            <summary>${escapeHtml(sec.title)}</summary>
            <div class="accordion-body">${escapeHtml(sec.content)}</div>
          </details>
        `;
      }).join('');
    }

    async function importSettings() {
      const rawText = document.getElementById('settings-import-text').value.trim();
      if (!rawText) return alert('テキストが入力されていません！');

      localStorage.setItem('project_settings_text', rawText);
      renderSettings(rawText);

      try {
        await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: rawText })
        });
      } catch (e) {
        console.warn('D1 sync skipped.');
      }
      alert('設計書をインポートし、表示を更新しました！');
    }

    async function fetchIdeas() {
      const list = document.getElementById('idea-list');
      list.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem;">D1と通信中...</div>';
      try {
        const res = await fetch('/api/ideas');
        const ideas = await res.json();
        window._ideaCache = ideas || [];
        renderIdeaList();
      } catch (e) {
        list.innerHTML = '<div style="color:#ef4444; font-size:0.85rem;">取得に失敗しました</div>';
      }
    }

    function renderIdeaList() {
      const list = document.getElementById('idea-list');
      const filter = document.getElementById('idea-filter').value;
      const ideas = window._ideaCache || [];

      const filtered = filter === 'all' 
        ? ideas 
        : ideas.filter(item => item.category === filter);

      if (filtered.length === 0) {
        list.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem;">該当するネタはありません</div>';
        return;
      }

      list.innerHTML = filtered.map(item => {
        const cat = item.category || 'その他';
        const tagClass = getCategoryTagClass(cat);

        return `
          <div class="item-card" onclick="loadIdeaToEditor('${item.id}')">
            <div class="card-actions" onclick="event.stopPropagation()">
              <button class="action-btn copy" onclick="copyIdeaItem('${item.id}')">コピー</button>
              <button class="action-btn delete" onclick="deleteIdea('${item.id}')">削除</button>
            </div>
            <div class="item-header">
              <span class="item-tag ${tagClass}">${escapeHtml(cat)}</span>
              <span class="item-date">${new Date(item.created_at).toLocaleDateString('ja-JP')}</span>
            </div>
            <div class="item-title">${escapeHtml(item.title)}</div>
            <div class="item-body">${escapeHtml(item.body || '')}</div>
          </div>
        `;
      }).join('');
    }

    function exportCurrentIdea() {
      const title = document.getElementById('idea-title').value.trim();
      const body = document.getElementById('idea-body').value.trim();
      const category = document.getElementById('idea-category').value;

      if (!title && !body) return alert('コピーするネタがありません！');

      const text = `【ネタ】${title}\n【分類】${category}\n\n${body}`;
      copyToClipboard(text, 'ネタの内容をクリップボードにコピーしました！');
    }

    function copyIdeaItem(id) {
      const idea = (window._ideaCache || []).find(i => i.id === id);
      if (!idea) return;
      const text = `【ネタ】${idea.title}\n【分類】${idea.category || 'メインネタ'}\n\n${idea.body || ''}`;
      copyToClipboard(text, 'ネタの内容をクリップボードにコピーしました！');
    }

    async function deleteIdea(id) {
      if (!confirm('このネタを削除してもよろしいですか？')) return;
      try {
        await fetch(`/api/ideas?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
        if (currentIdeaId === id) resetIdeaForm();
        fetchIdeas();
      } catch (e) {
        alert('削除に失敗しました');
      }
    }

    // --- 下書き機能 ---
    let currentDraftId = null;

    function importDraft() {
      const text = document.getElementById('import-text').value;
      if (!text) return alert('テキストが貼り付けられていません！');
      
      const titleMatch = text.match(/【タイトル】\n([\s\S]*?)(?=\n【(?:前半：)?(?:現場ノベル・)?漫才(?:対話)?パート】|$)/);
      const manzaiMatch = text.match(/【(?:前半：)?(?:現場ノベル・)?漫才(?:対話)?パート】\n([\s\S]*?)(?=\n【(?:後半：)?(?:現場DX・)?(?:実践)?解説パート】|$)/);
      const techMatch = text.match(/【(?:後半：)?(?:現場DX・)?(?:実践)?解説パート】\n([\s\S]*?)$/);

      if (titleMatch) document.getElementById('draft-title').value = titleMatch[1].trim();
      if (manzaiMatch) document.getElementById('draft-manzai').value = manzaiMatch[1].trim();
      if (techMatch) document.getElementById('draft-tech').value = techMatch[1].trim();
      
      document.getElementById('import-text').value = '';
      alert('各項目に振り分けました！');
    }

    function exportDraft() {
      const title = document.getElementById('draft-title').value.trim();
      const manzai = document.getElementById('draft-manzai').value.trim();
      const tech = document.getElementById('draft-tech').value.trim();

      if (!title && !manzai && !tech) return alert('コピーする内容がありません！');

      const formattedText = `【タイトル】\n${title}\n\n【前半：現場ノベル・漫才パート】\n${manzai}\n\n【後半：現場DX・実践解説パート】\n${tech}`;
      copyToClipboard(formattedText, '下書き全文をクリップボードにコピーしました！');
    }

    async function fetchDrafts() {
      const list = document.getElementById('draft-list');
      list.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem;">D1と通信中...</div>';
      try {
        const res = await fetch('/api/drafts');
        const drafts = await res.json();
        if (!drafts || drafts.length === 0) {
          list.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem;">保存された下書きはありません</div>';
          return;
        }
        window._draftCache = drafts;
        list.innerHTML = drafts.map(item => `
          <div class="item-card" onclick="loadDraftToEditor('${item.id}')">
            <div class="card-actions" onclick="event.stopPropagation()">
              <button class="action-btn delete" onclick="deleteDraft('${item.id}')">削除</button>
            </div>
            <div class="item-header">
              <span class="item-date">${new Date(item.created_at).toLocaleDateString('ja-JP')}</span>
            </div>
            <div class="item-title">${escapeHtml(item.title)}</div>
            <div class="item-body"><b>【漫才】</b><br>${escapeHtml((item.manzai || '').slice(0, 60))}...</div>
          </div>
        `).join('');
      } catch (e) {
        list.innerHTML = '<div style="color:#ef4444; font-size:0.85rem;">取得に失敗しました</div>';
      }
    }

    async function saveDraft() {
      const title = document.getElementById('draft-title').value.trim();
      if (!title) return alert('タイトルを入力してください');

      const payload = {
        id: currentDraftId,
        title,
        manzai: document.getElementById('draft-manzai').value,
        tech: document.getElementById('draft-tech').value
      };

      try {
        const res = await fetch('/api/drafts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        currentDraftId = result.id;
        alert('D1データベースに保存しました！');
        fetchDrafts();
      } catch (e) {
        alert('保存に失敗しました');
      }
    }

    function loadDraftToEditor(id) {
      const draft = (window._draftCache || []).find(d => d.id === id);
      if (!draft) return;
      currentDraftId = draft.id;
      document.getElementById('draft-title').value = draft.title;
      document.getElementById('draft-manzai').value = draft.manzai || '';
      document.getElementById('draft-tech').value = draft.tech || '';
      document.getElementById('draft-form-title').innerText = '✏️ 下書きの編集更新';
      document.getElementById('draft-cancel-btn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetEditor() {
      currentDraftId = null;
      document.getElementById('draft-title').value = '';
      document.getElementById('draft-manzai').value = '';
      document.getElementById('draft-tech').value = '';
      document.getElementById('draft-form-title').innerText = '📝 下書きエディタ（二段ロケット型）';
      document.getElementById('draft-cancel-btn').style.display = 'none';
    }

    async function deleteDraft(id) {
      if (!confirm('この下書きを削除してもよろしいですか？')) return;
      try {
        await fetch(`/api/drafts?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
        if (currentDraftId === id) resetEditor();
        fetchDrafts();
      } catch (e) {
        alert('削除に失敗しました');
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    // スプラッシュ画面の制御
    window.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        setTimeout(() => {
          splash.classList.add('fade-out');
          setTimeout(() => {
            splash.style.display = 'none';
          }, 600);
        }, 1500);
      }
    });

    // サービスワーカー（sw.js）の登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('Service Worker 登録成功:', registration.scope);
          })
          .catch((error) => {
            console.error('Service Worker 登録失敗:', error);
          });
      });
    }

    // 初回データ読み込み
    window.addEventListener('load', () => {
      fetchIdeas();
      fetchDrafts();
      loadSettings();
    });
  </script>
</body>
</html>
